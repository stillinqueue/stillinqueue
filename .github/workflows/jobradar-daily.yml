name: Job Radar daily run

# Triggers the backend's daily Job Radar run and keeps the (free-tier) Render
# instance awake until it finishes. Works with no setup.
# Optional: set a repository *variable* JOBRADAR_BACKEND_URL (Settings → Secrets and
# variables → Actions → Variables) if the backend moves away from the default below.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00/07:00 in Munich
  workflow_dispatch: {}

env:
  URL: ${{ vars.JOBRADAR_BACKEND_URL || 'https://sq-ai-renderer.onrender.com' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wake backend
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$URL/health" > /dev/null; then echo "Backend is up"; exit 0; fi
            echo "Waiting for backend ($i)…"; sleep 10
          done
          echo "Backend did not wake up"; exit 1

      - name: Start Job Radar
        run: curl -fsS -X POST "$URL/api/jobradar/cron"

      - name: Wait until finished
        run: |
          for i in $(seq 1 80); do
            sleep 30
            running=$(curl -fsS --max-time 30 "$URL/api/jobradar/cron/status" | python3 -c 'import sys,json; print(json.load(sys.stdin)["running"])')
            echo "Runs in progress: $running"
            if [ "$running" = "0" ]; then exit 0; fi
          done
          echo "Still running after 40 minutes"
